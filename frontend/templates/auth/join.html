{% extends "base.html" %}
{% block title %}{{ t.join_title }} — {{ t.app_name }}{% endblock %}

{% block extra_css %}
<style>
.join-card { max-width: 420px; margin: 40px auto; text-align: center; }
.join-card .icon { font-size: 52px; margin-bottom: 12px; }
.join-card h2 { margin-bottom: 8px; }
.join-card .subtitle { color: #888; margin-bottom: 28px; font-size: 15px; }
.form-group { text-align: left; margin-bottom: 16px; }
.form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #555; }
.form-group input {
    width: 100%; padding: 11px 14px; font-size: 15px;
    border: 1.5px solid #ddd; border-radius: 6px;
    box-sizing: border-box; transition: border-color 0.15s;
}
.form-group input:focus { outline: none; border-color: #4CAF50; }
.btn-full { width: 100%; padding: 12px; font-size: 16px; }
.email-chip {
    display: inline-block; background: #f0f0f0; border-radius: 20px;
    padding: 4px 14px; font-size: 14px; color: #555; margin-bottom: 24px;
}
</style>
{% endblock %}

{% block content %}
<div class="card join-card">
    <div class="icon">⚽</div>
    <h2>{{ t.join_title }}</h2>
    <p class="subtitle"><strong>{{ invite.sender_name.split()[0] }}</strong> {{ t.join_subtitle }}</p>
    <div class="email-chip">{{ invite.email }}</div>
    <form method="POST">
        <input type="hidden" name="invite_token" value="{{ token }}">
        <div class="form-group">
            <label for="name">{{ t.join_name_label }}</label>
            <input type="text" id="name" name="name"
                   placeholder="{{ t.join_name_placeholder }}"
                   autocomplete="given-name"
                   required autofocus>
        </div>
        <div class="form-group">
            <label for="password">{{ t.join_password_label }}</label>
            <input type="password" id="password" name="password"
                   placeholder="{{ t.join_password_placeholder }}"
                   autocomplete="new-password"
                   minlength="4"
                   required>
        </div>
        <button type="submit" class="btn btn-full">{{ t.join_btn }}</button>
    </form>
</div>
{% endblock %}
